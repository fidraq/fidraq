name: saftaja-test

services:
  testdb:
    image: postgres:18
    ports:
      - "5433:5432"
    environment:
      POSTGRES_PASSWORD: test_password
      POSTGRES_USER: test_user
      POSTGRES_DB: test_khazina
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d test_khazina"]
      interval: 5s
      timeout: 5s
      retries: 5
