name: Release Khazina

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  test:
    uses: ./.github/workflows/reusable-test.yaml

  build:
    needs: test
    uses: ./.github/workflows/reusable-build.yaml
    secrets: inherit
    with:
      image_name: khazina
      context_path: ./khazina
