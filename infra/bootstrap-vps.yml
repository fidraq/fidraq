- name: Bootstrap VPS
  hosts: all
  become: true
  vars:
    maintenance_user: maintenance
    deploy_user: deploy
    my_public_key: "{{ lookup('env', 'MY_PUBLIC_KEY') }}"

  handlers:
    - name: Restart fail2ban
      service:
        name: fail2ban
        state: restarted

    - name: Restart SSH
      service:
        name: ssh
        state: restarted

  tasks:
    # ── System updates ──────────────────────────────────────────────
    - name: Update apt cache and upgrade all packages
      apt:
        update_cache: true
        upgrade: dist
        cache_valid_time: 3600

    - name: Install base packages
      apt:
        name:
          - git
          - curl
          - wget
          - htop
          - ufw
          - fail2ban
          - unattended-upgrades
          - ca-certificates
          - gnupg
        state: present

    # ── Users ───────────────────────────────────────────────────────
    - name: Create maintenance user
      user:
        name: "{{ maintenance_user }}"
        shell: /bin/bash
        groups: sudo
        append: true
        state: present
        password: "!"

    - name: Allow maintenance user to sudo without password
      lineinfile:
        path: /etc/sudoers.d/maintenance
        line: "{{ maintenance_user }} ALL=(ALL) NOPASSWD:ALL"
        create: true
        mode: "0440"
        validate: "visudo -cf %s"

    - name: Add SSH key to maintenance user
      ansible.posix.authorized_key:
        user: "{{ maintenance_user }}"
        key: "{{ my_public_key }}"
        state: present

    - name: Create deploy user
      user:
        name: "{{ deploy_user }}"
        shell: /bin/bash
        state: present

    - name: Create deploy user .ssh directory
      file:
        path: /home/{{ deploy_user }}/.ssh
        state: directory
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0700"

    - name: Generate deploy SSH key on server
      community.crypto.openssh_keypair:
        path: /home/{{ deploy_user }}/.ssh/id_ed25519
        type: ed25519
        comment: "saftaja-deploy"
        owner: "{{ deploy_user }}"
        force: false
      register: deploy_keypair

    - name: Add SSH key to deploy user
      ansible.posix.authorized_key:
        user: "{{ deploy_user }}"
        key: "{{ deploy_keypair.public_key }} saftaja-deploy"
        state: present

    - name: Create deploy user SSH config
      copy:
        dest: /home/{{ deploy_user }}/.ssh/config
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0600"
        content: |
          Host github.com
            HostName github.com
            User git
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes

    # ── Unattended upgrades ─────────────────────────────────────────
    - name: Configure unattended upgrades
      copy:
        dest: /etc/apt/apt.conf.d/50unattended-upgrades
        content: |
          Unattended-Upgrade::Allowed-Origins {
              "${distro_id}:${distro_codename}-security";
          };
          Unattended-Upgrade::AutoFixInterruptedDpkg "true";
          Unattended-Upgrade::MinimalSteps "true";
          Unattended-Upgrade::Remove-Unused-Dependencies "true";
          Unattended-Upgrade::Automatic-Reboot "false";

    - name: Enable unattended upgrades
      copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";

    # ── Rootless Docker ─────────────────────────────────────────────
    - name: Get deploy user UID
      getent:
        database: passwd
        key: "{{ deploy_user }}"
      register: deploy_user_info

    - name: Set deploy UID fact
      set_fact:
        deploy_uid: "{{ deploy_user_info.ansible_facts.getent_passwd[deploy_user][1] }}"

    - name: Enable linger for deploy user
      command: loginctl enable-linger {{ deploy_user }}
      changed_when: false

    - name: Install rootless Docker
      ansible.builtin.include_role:
        name: konstruktoid.docker_rootless
      vars:
        docker_user: "{{ deploy_user }}"
        docker_compose: true
        docker_rootful: false
        create_docker_user: false
        docker_allow_privileged_ports: true

    - name: Flush handlers
      meta: flush_handlers

    # ── Firewall ────────────────────────────────────────────────────
    - name: Allow SSH
      community.general.ufw:
        rule: allow
        port: "22"
        proto: tcp

    - name: Allow HTTP
      community.general.ufw:
        rule: allow
        port: "80"
        proto: tcp

    - name: Allow HTTPS
      community.general.ufw:
        rule: allow
        port: "443"
        proto: tcp

    - name: Enable UFW
      community.general.ufw:
        state: enabled
        policy: deny
        direction: incoming

    # ── Fail2ban ────────────────────────────────────────────────────
    - name: Configure fail2ban SSH jail
      copy:
        dest: /etc/fail2ban/jail.local
        content: |
          [sshd]
          enabled = true
          port = 22
          filter = sshd
          maxretry = 3
          bantime = 3600
          findtime = 600
      notify: Restart fail2ban

    # ── SSH hardening (LAST — uses handler, not immediate restart) ──
    - name: Verify maintenance user can SSH
      ansible.builtin.assert:
        that:
          - my_public_key | length > 0
        fail_msg: "MY_PUBLIC_KEY is empty — refusing to harden SSH (you'd be locked out)"

    - name: Harden SSH config
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
      loop:
        - { regexp: '^#?PermitRootLogin', line: 'PermitRootLogin no' }
        - { regexp: '^#?PasswordAuthentication', line: 'PasswordAuthentication no' }
        - { regexp: '^#?PubkeyAuthentication', line: 'PubkeyAuthentication yes' }
        - { regexp: '^#?LoginGraceTime', line: 'LoginGraceTime 30' }
        - { regexp: '^#?MaxAuthTries', line: 'MaxAuthTries 3' }
        - { regexp: '^#?X11Forwarding', line: 'X11Forwarding no' }
        - { regexp: '^#?AllowUsers', line: 'AllowUsers {{ maintenance_user }} {{ deploy_user }}' }
      notify: Restart SSH
