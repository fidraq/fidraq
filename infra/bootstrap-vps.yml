- name: Boostrap VPS
  hosts: all
  become: true
  vars:
    ssh_port: 2222
    maintenance_user: maintenance
    deploy_user: deploy
    my_public_key: "{{ lookup('env', 'MY_PUBLIC_KEY') }}"

  tasks:
    - name: Update apt cache and upgrade all packages
      apt:
        update_cache: true
        upgrade: dist
        cache_valid_time: 3600

    - name: Install base packages
      apt:
        name:
          - git
          - curl
          - wget
          - htop
          - ufw
          - fail2ban
          - unattended-upgrades
          - ca-certificates
          - gnupg
        state: present

    - name: Create maintenance user
      user:
        name: "{{ maintenance_user }}"
        shell: /bin/bash
        groups: sudo
        append: true
        state: present
        password: "!"

    - name: Allow maintenance user to sudo without password
      lineinfile:
        path: /etc/sudoers.d/maintenance
        line: "{{ maintenance_user }} ALL=(ALL) NOPASSWD:ALL"
        create: true
        validate: "visudo -cf %s"

    - name: Add SSH key to maintenance user
      ansible.posix.authorized_key:
        user: "{{ maintenance_user }}"
        key: "{{ my_public_key }}"
        state: present

    - name: Create deploy user
      user:
        name: "{{ deploy_user }}"
        shell: /bin/bash
        state: present

    - name: Generate deploy SSH key on server
      community.crypto.openssh_keypair:
        path: /home/{{ deploy_user }}/.ssh/id_ed25519
        type: ed25519
        comment: "saftaja-deploy"
        owner: "{{ deploy_user }}"
        force: false
      register: deploy_keypair

    - name: Add SSH key to deploy user
      ansible.posix.authorized_key:
        user: "{{ deploy_user }}"
        key: "{{ deploy_keypair.public_key }} saftaja-deploy"
        state: present
        exclusive: true
