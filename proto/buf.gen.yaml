version: v2
clean: true
plugins:
  - remote: buf.build/protocolbuffers/go
    out: ../khazina/internal/transport/proto
    opt: paths=source_relative
  - remote: buf.build/connectrpc/gosimple
    out: ../khazina/internal/transport/proto
    opt: paths=source_relative
  - remote: buf.build/bufbuild/es
    out: ../diwan/src/gen
    opt: target=js+dts
    include_imports: true
  - remote: buf.build/connectrpc/es
    out: ../diwan/src/gen
    opt: target=ts
  - remote: buf.build/connectrpc/query-es
    out: ../diwan/src/gen
    opt: target=ts
