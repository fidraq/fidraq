version: v2
clean: true
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.11
    out: ../khazina/internal/transport/proto
    opt: paths=source_relative
  - remote: buf.build/connectrpc/gosimple
    out: ../khazina/internal/transport/proto
    opt: paths=source_relative
  - remote: buf.build/bufbuild/es:v2.12.0
    out: ../diwan/src/gen
    opt: target=js+dts
    include_imports: true
  - remote: buf.build/connectrpc/es:v1.6.1
    out: ../diwan/src/gen
    opt: target=ts
  - remote: buf.build/connectrpc/query-es:v2.2.0
    out: ../diwan/src/gen
    opt: target=ts
