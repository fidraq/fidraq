services:
  db:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_USER: somehuman
      POSTGRES_DB: paydb
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U somehuman -d paydb"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    image: migrate/migrate
    volumes:
      - ./internal/store/migrations:/migrations
    command:
      [
        "-path",
        "/migrations",
        "-database",
        "postgres://somehuman:password@db:5432/paydb?sslmode=disable",
        "up",
      ]
    depends_on:
      db:
        condition: service_healthy
