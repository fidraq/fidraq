# Local Postgres only. Everything else runs natively via mise (see mise.toml).

name: fidraq

services:
  db:
    image: postgres:18
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: fidraq
      POSTGRES_PASSWORD: fidraq
      POSTGRES_DB: fidraq
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fidraq -d fidraq"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Throwaway database for `mise run test`, wiped on every restart.
  testdb:
    image: postgres:18
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: test_khazina
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d test_khazina"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
