# Base compose file - shared between dev and prod
# Dev: docker compose up (auto-loads compose.override.yaml)
# Prod: docker compose -f compose.yaml -f compose.prod.yaml up

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_DATABASE}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 5

  khazina:
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      PORT: ${PORT:-8080}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      VERIFY_DOMAIN_SECRET: ${VERIFY_DOMAIN_SECRET}
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      EMAILER: ${EMAILER}
      RESEND_API_KEY: ${RESEND_API_KEY}
      DOMAIN: ${DOMAIN}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}

volumes:
  pgdata:
