version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/store/queries"
    schema: "internal/store/migrations"
    gen:
      go:
        package: "store"
        out: "internal/store"
        sql_package: "pgx/v5"
        emit_interface: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"

          - db_type: "uuid"
            nullable: false
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"

          - db_type: "pg_catalog.numeric"
            nullable: true
            go_type:
              import: "github.com/shopspring/decimal"
              type: "NullDecimal"

          - db_type: "pg_catalog.numeric"
            nullable: false
            go_type:
              import: "github.com/shopspring/decimal"
              type: "Decimal"

          - column: "projects.environment"
            go_type:
              type: "ProjectEnvironment"

          - column: "gateway_accounts.connector_type"
            go_type:
              type: "ConnectorType"

          - column: "invoices.status"
            go_type:
              type: "InvoiceStatus"

          - column: "payment_intents.status"
            go_type:
              type: "PaymentIntentStatus"

          - column: "payment_intents.payment_method"
            go_type:
              type: "PaymentMethod"

          - column: "transactions.transaction_type"
            go_type:
              type: "TransactionType"

          - column: "transactions.status"
            go_type:
              type: "TransactionStatus"
