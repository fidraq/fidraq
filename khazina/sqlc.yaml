version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/store/queries"
    schema: "internal/store/migrations"
    gen:
      go:
        package: "store"
        out: "internal/store"
        sql_package: "pgx/v5"
        emit_interface: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"

          - db_type: "uuid"
            nullable: false
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"

          - column: "invoices.amount_minor"
            go_type:
              import: "github.com/rbconsult-bh/saftaja/khazina/internal/pkg/money"
              type: "MinorAmount"

          - column: "invoice_items.unit_price_minor"
            go_type:
              import: "github.com/rbconsult-bh/saftaja/khazina/internal/pkg/money"
              type: "MinorAmount"

          - column: "invoice_items.amount_minor"
            go_type:
              import: "github.com/rbconsult-bh/saftaja/khazina/internal/pkg/money"
              type: "MinorAmount"

          - column: "payment_intents.amount_minor"
            go_type:
              import: "github.com/rbconsult-bh/saftaja/khazina/internal/pkg/money"
              type: "MinorAmount"

          - column: "invoices.currency"
            go_type:
              import: "github.com/rbconsult-bh/saftaja/khazina/internal/pkg/money"
              type: "Currency"

          - column: "payment_intents.currency"
            go_type:
              import: "github.com/rbconsult-bh/saftaja/khazina/internal/pkg/money"
              type: "Currency"

          - column: "projects.environment"
            go_type:
              type: "ProjectEnvironment"

          - column: "gateway_accounts.connector_type"
            go_type:
              type: "ConnectorType"

          - column: "invoices.status"
            go_type:
              type: "InvoiceStatus"

          - column: "payment_intents.status"
            go_type:
              type: "PaymentIntentStatus"

          - column: "payment_intents.payment_method"
            go_type:
              type: "PaymentMethod"

          - column: "gateway_operations.operation_type"
            go_type:
              type: "GatewayOperationType"

          - column: "gateway_operations.status"
            go_type:
              type: "GatewayOperationStatus"

          - db_type: "timestamptz"
            nullable: false
            go_type:
              import: "time"
              type: "Time"

          - db_type: "timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
