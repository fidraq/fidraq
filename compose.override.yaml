# Dev overrides - auto-loaded by docker compose up
# Hot reload enabled, ports exposed, no SSL

services:
  db:
    ports:
      - "5432:5432"

  khazina:
    build:
      context: ./khazina
      dockerfile: Dockerfile
      target: dev
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
      - "40000:40000" # dlv
    security_opt:
      - "seccomp:unconfined" # dlv
    cap_add:
      - SYS_PTRACE # dlv
    develop:
      watch:
        - path: ./khazina
          target: /khazina
          action: sync+restart
          ignore:
            - go.sum
            - node_modules
            - tests
        - path: ./khazina/go.sum
          action: rebuild

  diwan:
    build:
      context: ./diwan
      dockerfile: Dockerfile
      target: dev
    ports:
      - "5173:5173"
    develop:
      watch:
        - path: ./diwan/src
          target: /app/src
          action: sync
        - path: ./diwan/package.json
          action: rebuild

  bawaba:
    build:
      context: ./bawaba
      dockerfile: Dockerfile
      target: prod
    ports:
      - "3000:80"

  migrate:
    image: migrate/migrate:latest
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./khazina/internal/store/migrations:/migrations
    profiles:
      - tools
