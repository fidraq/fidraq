# Production overrides with Caddy for SSL
# Usage: docker compose -f compose.yaml -f compose.prod.yaml up -d
# For Docker Swarm: docker stack deploy -c compose.yaml -c compose.prod.yaml saftaja

services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
      BASE_DOMAIN: ${BASE_DOMAIN}
      VERIFY_DOMAIN_SECRET: ${VERIFY_DOMAIN_SECRET}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - khazina
      # - diwan
      # - bawaba
    networks:
      saftaja_net:
        ipv4_address: 172.27.0.10

  khazina:
    image: ${REGISTRY:-ghcr.io/rbconsult-bh/saftaja}/khazina:${TAG:-main}
    networks:
      saftaja_net:
        ipv4_address: 172.27.0.11

  db:
    networks:
      saftaja_net:
        ipv4_address: 172.27.0.12

  tailscale:
    image: tailscale/tailscale:latest
    restart: always
    hostname: saftaja
    networks:
      saftaja_net:
        ipv4_address: 172.27.0.15
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_ROUTES=172.27.0.0/16
    volumes:
      - tailscale_state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin

  # diwan:
  #   image: ${REGISTRY:-ghcr.io/rbconsult-bh/saftaja}/diwan:${TAG:-main}
  #   deploy:
  #     replicas: 1
  #
  # bawaba:
  #   image: ${REGISTRY:-ghcr.io/rbconsult-bh/saftaja}/bawaba:${TAG:-main}
  #   deploy:
  #     replicas: 1

volumes:
  caddy_data:
  caddy_config:
  tailscale_state:

networks:
  saftaja_net:
    ipam:
      config:
        - subnet: 172.27.0.0/16
